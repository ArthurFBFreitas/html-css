<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        @font-face {
            font-family: 'Fonte';
            src: url('Mistical Spring.otf') format('opentype'), 
            url('Mistical Spring.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            font-family: 'Roboto';
            src: url(fontes/Roboto-VariableFont_wdth\,wght.ttf) format(truetype);
            font-weight: bold;
            font-style: normal;

            /*
                Tipos de Format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advancend Typography)
                - svg

            */
            
        }

        body{
            font-family: 'Roboto', Helvetica, sans-serif;
            /*
            Medidas Abosolutas
            cm, mm, in, px, pt, pc

            Medidas Absolutas
            em, ex, rem, vw, vh, %
            OBS: 16px geralmente = 1em
            OBS: Recomendado usar as medidas px e em.
            */
            font-size: 1em;
        }

        
        h1{
            font-family: 'Fonte', 'Times New Roman', Times, serif
}

        
    </style>
    <title>Fontes em CSS</title>
</head>
<body>
    <h1>Trabalhando com Fontes</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nulla delectus nisi deleniti alias. Similique eveniet deserunt quibusdam minus ab?</p>
    <h2>Subtítulo de exercício</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
</body>
</html>
