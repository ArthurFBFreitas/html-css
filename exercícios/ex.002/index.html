<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>
        É possível escrever um parágrafo de qualquer
        jeito. Basta inserir tudo entre 
        as tags &lt;p&gt; e &lt;/p&gt;.
    </p>

    <p>
        Para quebrar o texto, <br>desta forma, use a tag &lt;br&gt;.
    </p>

    <p>Símbolos especiais:
        &nbsp;  <!--Espaço em branco-->
        &reg;   <!--Marca Registrada-->
        &copy;  <!--Copyright-->
        &trade; <!--Trade Mark-->
        &euro;  <!--Euro-->
        &yen;   <!--Yen-->
        &larr;  <!--Seta esquerda-->
        &uarr;  <!--Seta acima-->
        &rarr;  <!--Seta direita-->
        &darr;.  <!--Seta baixo-->
        <br>
        Existem mais símbolos especiais, além desses.
    </p>

    <p>Adicionando emojis:
        &#x1F9D9;
        &#x1F9D1;
        
    </p> 
</html>
