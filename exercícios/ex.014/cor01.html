<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores no CSS</title>
</head>
<body>
    <!--Representação por nomes-->
    <h2 style="background-color: blue; color: white;">Cor Através do nome.</h2>
    
    <!--Representação por códigos Hexadecimais-->
    <h2 style="background-color: #0000ff; color: #ffffff;">Cor Através de Código Hexadecimais.</h2>
    
    <!--Representação em RGB (Red, Green, Blue)-->
    <h2 style="background-color: rgb(0, 0, 255); color: rgb(255, 255, 255);">Cor Através de RGB.</h2>
    
    <!--Representação por HSL (Hue, Sturation, Luminosity)-->
    <h2 style="background-color: hsl(240, 100%, 50%); color: hsl(0, 0%, 100%);">Cor Através de HSL.</h2>
    
    <!--Transparência-->
    <h2 style="background-color: rgba(0, 0, 255, 0.496); color: white;">Transparência da cor.</h2>
</body>
</html>
