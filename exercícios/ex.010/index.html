<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML</title>
</head>
<body>
    <h1>Inserindo Vídeos Hospedados Localmente</h1>
    <p>Exemplo de vídeo hospedado localmente:</p>
    <video controls width="500" poster="imagens/capavideo-ds3.jpg">
        <source src="video/meu-video-sr.mp4" type="video/mp4">
        <source src="video/meu-video-sr-dois.webm" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeo.</p>
    </video>
    
    <h1>Inserindo Vídeo Externo</h1>
    <h2>Inserindo Vídeo do Youtube</h2>
    <iframe  width="560" height="315" src="https://www.youtube.com/embed/KaQaZ7YWXgY?si=1-ZMK7fClap0233d" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
