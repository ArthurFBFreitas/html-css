<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <picture>
       <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png"> 
       <source media="(max-width: 890px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/Yu-City Kamata - Dan Bodan.mp3" type="audio/ogg">
        <source src="midia/Yu-City Kamata - Dan Bodan.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador não suporta os formatos de áudio.</p>
    </audio>

    <video src=""></video>
</body>
</html>
